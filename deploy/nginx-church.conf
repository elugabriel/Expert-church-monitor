# Replace __DOMAIN__ with your domain (setup_server.sh and the guide do this with sed).
# One server block serves the main address and every church subdomain.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ *.__DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ *.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The app accepts uploads up to 3 MB.
    client_max_body_size 4m;

    # Plain CSS, JS and images are served by nginx directly.
    location /static/ {
        alias /srv/church/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/church/church.sock;
        proxy_set_header Host $host;
        # The app trusts these (ProxyFix) so links and church subdomains come out right.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
