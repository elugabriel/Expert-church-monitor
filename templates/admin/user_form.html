{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="mb-3">Add User</h4>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="full_name">
        </div>
        <div class="mb-3">
          <label class="form-label">Username *</label>
          <input type="text" class="form-control" name="username" required>
        </div>
        <p class="text-muted small">A temporary password is generated and shown once after you create the user. They must change it when they first log in.</p>
        <button class="btn btn-primary" type="submit">Create User</button>
        <a href="{{ url_for('admin_users') }}" class="btn btn-light">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
