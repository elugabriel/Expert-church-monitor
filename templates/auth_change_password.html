{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-4">
      <h4 class="mb-2">Change password</h4>
      {% if forced %}
        <div class="alert alert-warning small">Your password was reset. Choose your own new password to continue.</div>
      {% endif %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">{{ 'Temporary password' if forced else 'Current password' }}</label>
          <input type="password" class="form-control" name="current_password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" class="form-control" name="new_password" minlength="8" required>
          <div class="form-text">At least 8 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input type="password" class="form-control" name="confirm_password" minlength="8" required>
        </div>
        <button class="btn btn-primary" type="submit">Save password</button>
        {% if not forced %}<a href="{{ url_for('index') }}" class="btn btn-light">Cancel</a>{% endif %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
